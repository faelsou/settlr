name: CI/CD

# Esteira: lint → testes + segurança → build, scan e push da imagem → deploy no Minikube.
#
# Pull request: roda até o build. Imagens de PR do próprio repositório vão para o
#   Docker Hub como sha-<curto> e pr-<n>; PR de fork só faz build (sem secrets).
# Push na main: publica sha-<curto> e latest e faz o deploy no Minikube local.
# Manual (Run workflow): sem input roda a esteira inteira; com rollback_to só
#   faz o deploy de uma tag já publicada.
#
# Secrets: DOCKERHUB_USERNAME (também é o namespace das imagens) e DOCKERHUB_TOKEN.
# Variable opcional: KUBE_CONTEXT (padrão devops-dev).
# O deploy roda num runner self-hosted com labels [self-hosted, linux, minikube],
# na máquina do cluster, com kubectl já apontando para ele.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: Tag já publicada no Docker Hub (ex. sha-1a2b3c4). Preenchido, só faz o deploy dela.
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'faelsouz' }}

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.rollback_to == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        working-directory: api
        # O restante do repositório ainda tem achados antigos; o gate cobre o que esta pipeline exige.
        run: >
          pipx run ruff check
          app/core/observability.py
          app/core/config.py
          app/core/llm.py
          app/core/logging.py
          app/core/tracing.py
          app/main.py
          app/workers/celery_app.py
          app/api/routes/health.py
          app/api/routes/webhooks.py
          app/services
          app/aiops
          tests/test_observability.py
          tests/test_services.py
          tests/test_aiops.py
      - name: Shell
        run: |
          bash -n docker/release.sh docker/migrate.sh
          shellcheck scripts/deploy-minikube.sh
      - name: Dockerfiles
        run: |
          for f in docker/api.Dockerfile docker/web.Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < "$f"
          done
      - name: Manifestos Kubernetes
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.28.3 k8s/minikube.yaml k8s/hpa.yaml k8s/aiops/aiops.yaml k8s/observability/alertmanager.yaml

  test-api:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cobranca
          POSTGRES_PASSWORD: cobranca
          POSTGRES_DB: cobranca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cobranca -d cobranca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: "5432"
      TEST_PG_USER: cobranca
      TEST_PG_PASSWORD: cobranca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest --cov=app --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: api/coverage.xml

  test-web:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dependências
        run: npm ci
      - name: Tipos
        run: npx tsc --noEmit

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Segredos no código
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: "1"
      - name: Dependências Python
        run: |
          pip install pip-audit
          pip install ./api
          pip-audit --skip-editable
      - name: Dependências npm
        working-directory: web
        # HIGH sem correção compatível (next → postcss) fica no relatório; CRITICAL bloqueia.
        run: npm audit --omit=dev --audit-level=critical
      - name: Configuração (Dockerfile e Kubernetes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  build:
    needs: [test-api, test-web, security]
    runs-on: ubuntu-latest
    # cache-to type=gha grava no cache do Actions. Sem actions: write o token
    # recusa a camada e o build, que já tinha concluído, falha no fim.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: cobranca-api
            dockerfile: docker/api.Dockerfile
            build_args: ""
          # Mesmos build args do k8s/minikube.yaml: o Next.js grava o proxy no build.
          - name: cobranca-web
            dockerfile: docker/web.Dockerfile
            build_args: |
              NEXT_PUBLIC_API_BASE_URL=
              API_UPSTREAM=http://webhook-api:8000
    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME || 'faelsouz' }}/${{ matrix.name }}
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan da imagem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Gate de vulnerabilidade crítica
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        if: env.PUSH == 'true'
        run: docker push --all-tags "$IMAGE"

  deploy:
    needs: build
    if: >-
      always() &&
      ((needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request') ||
       (github.event_name == 'workflow_dispatch' && inputs.rollback_to != ''))
    runs-on: [self-hosted, linux, minikube]
    environment:
      name: minikube
    concurrency:
      group: deploy-minikube
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        id: tag
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          if [ -n "$ROLLBACK_TO" ]; then
            echo "value=$ROLLBACK_TO" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy, smoke test e rollback
        env:
          KUBE_CONTEXT: ${{ vars.KUBE_CONTEXT || 'devops-dev' }}
          TAG: ${{ steps.tag.outputs.value }}
        run: bash scripts/deploy-minikube.sh "$TAG" "$IMAGE_NAMESPACE"
      - name: Resumo
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.value }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Deploy no Minikube"
            echo "- Tag: \`$TAG\`"
            echo "- Resultado: $STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
