# O token do webhook do AIOps vem do Secret aiops-secrets (ver docs/AIOPS.md).
# Sem esse Secret, o pod sobe e o envio ao AIOps volta 401 até ele existir.
# O receiver critical lê o Secret critical-page. Sem ele, o pod sobe e essa
# segunda entrega não sai.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "/etc/alertmanager/alertmanager-entry.sh"]
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            - name: config
              mountPath: /etc/alertmanager/alertmanager-entry.sh
              subPath: alertmanager-entry.sh
            - name: config
              mountPath: /etc/alertmanager/critical-default/SLACK_CRITICAL_WEBHOOK
              subPath: SLACK_CRITICAL_WEBHOOK
            - name: secrets
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: critical
              mountPath: /etc/alertmanager/critical-secret
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: secrets
          secret:
            secretName: aiops-secrets
            optional: true
            items:
              - key: AIOPS_WEBHOOK_TOKEN
                path: AIOPS_WEBHOOK_TOKEN
        - name: critical
          secret:
            secretName: critical-page
            optional: true
            items:
              - key: SLACK_CRITICAL_WEBHOOK
                path: SLACK_CRITICAL_WEBHOOK
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  selector: { app: alertmanager }
  ports:
    - name: http
      port: 9093
      targetPort: http
