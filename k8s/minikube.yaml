# Minikube local. Passo a passo: docs/MINIKUBE.md
# Não use docker/stack.yml aqui: aquele arquivo é do Swarm.
#
# As imagens vêm do Docker Hub (faelsouz/cobranca-api e faelsouz/cobranca-web),
# publicadas pelo .github/workflows/ci.yml. Tag nova: troque a tag aqui e aplique.
# A imagem web é construída com API_UPSTREAM=http://webhook-api:8000; não serve
# fora deste cluster.
# O PVC usa a StorageClass standard do Minikube. Se o perfil não tiver:
#   minikube addons enable storage-provisioner default-storageclass -p <perfil>
#   kubectl apply -f k8s/minikube.yaml
#   kubectl -n cobranca wait --for=condition=complete job/bootstrap --timeout=180s
#   kubectl -n cobranca port-forward svc/frontend-web 3000:3000
# Observabilidade fica de fora deste arquivo. Namespace próprio:
#   kubectl apply -k k8s/observability
#   kubectl -n observability port-forward svc/grafana 3001:3000
# O painel encaminha /auth, /invoices e os demais prefixos da API para o
# gateway dentro do cluster. Não é preciso publicar a API no host.
#
# Painel: http://127.0.0.1:3000  login operador@demo.local  tenant demo
apiVersion: v1
kind: Namespace
metadata:
  name: cobranca
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: cobranca
type: Opaque
stringData:
  postgres_password: cobranca
  postgres_app_password: cobranca_app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: cobranca
data:
  10-init-roles.sh: |
    #!/bin/bash
    set -euo pipefail
    APP_PW="$(cat "${POSTGRES_APP_PASSWORD_FILE:-/secrets/postgres_app_password}")"
    EVO_PW="$(cat "${POSTGRES_PASSWORD_FILE:-/secrets/postgres_password}")"
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
      -v app_pw="$APP_PW" -v evo_pw="$EVO_PW" -v db="$POSTGRES_DB" <<'SQL'
    CREATE ROLE cobranca_app LOGIN PASSWORD :'app_pw' NOSUPERUSER NOBYPASSRLS;
    GRANT CONNECT ON DATABASE :"db" TO cobranca_app;
    GRANT USAGE ON SCHEMA public TO cobranca_app;
    CREATE ROLE evolution LOGIN PASSWORD :'evo_pw';
    CREATE DATABASE evolution OWNER evolution;
    SQL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cobranca-env
  namespace: cobranca
data:
  ENV: dev
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: cobranca
  POSTGRES_PASSWORD: cobranca
  POSTGRES_APP_PASSWORD: cobranca_app
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_SECRET: dev-secret-change-me
  WEBHOOK_HMAC: dev-webhook-secret
  EVOLUTION_BASE_URL: https://apiwp.aiagentautomate.com.br
  # Vazios de propósito. A chave real fica nos Secrets evolution-api e llm-api
  # (não versionados). Os processos leem o Secret por cima deste valor.
  EVOLUTION_API_KEY: ""
  LLM_API_KEY: ""
  COBRANCA_URL: http://cobranca:8000
  CONCILIACAO_URL: http://conci-pgto:8000
  CADASTRO_URL: http://cadastro:8000
  CORS_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000"]'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: cobranca
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cobranca
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: cobranca
            - name: POSTGRES_USER
              value: cobranca
            - name: POSTGRES_PASSWORD_FILE
              value: /secrets/postgres_password
            - name: POSTGRES_APP_PASSWORD_FILE
              value: /secrets/postgres_app_password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cobranca", "-d", "cobranca"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: secrets
          secret:
            secretName: postgres-secrets
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cobranca
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cobranca
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7
          args: ["--appendonly", "yes"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cobranca
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap
  namespace: cobranca
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: faelsouz/cobranca-api:20261104-1457
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cobranca-env
          command: ["python", "-c"]
          args:
            - |
              import socket, subprocess, sys, time
              for _ in range(60):
                  try:
                      socket.create_connection(("postgres", 5432), 2).close()
                      break
                  except OSError:
                      time.sleep(2)
              else:
                  sys.exit("postgres nao subiu")
              subprocess.check_call([sys.executable, "-m", "app.cli", "migrate"])
              subprocess.check_call([sys.executable, "-m", "app.cli", "seed-demo"])
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-api
  namespace: cobranca
spec:
  replicas: 1
  selector:
    matchLabels: { app: webhook-api }
  template:
    metadata:
      labels: { app: webhook-api }
    spec:
      containers:
        - name: webhook-api
          image: faelsouz/cobranca-api:20261104-1457
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_NAME, value: webhook-api }
          envFrom:
            - configMapRef:
                name: cobranca-env
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-api
  namespace: cobranca
spec:
  selector: { app: webhook-api }
  ports:
    - port: 8000
      targetPort: 8000
---
