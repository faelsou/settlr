# Segredos da aplicação lidos por todos os processos via envFrom.secretRef.
# Valores de dev, no mesmo padrão de postgres/secret.yaml. Tirar do Git e rotacionar
# a chave do JWT é a SETL-94 (Sealed ou External Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: cobranca-auth
type: Opaque
stringData:
  JWT_SECRET: dev-secret-change-me
  WEBHOOK_HMAC: dev-webhook-secret
