apiVersion: apps/v1
kind: Deployment
metadata:
  name: relo-disp
spec:
  replicas: 1
  selector:
    matchLabels: { app: relo-disp }
  template:
    metadata:
      labels: { app: relo-disp }
    spec:
      containers:
        - name: relo-disp
          image: faelsouz/cobranca-api
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_NAME, value: relo-disp }
          envFrom:
            - configMapRef:
                name: cobranca-env
            # Senhas do Postgres. Chaves em minúsculo: o pydantic-settings não diferencia caixa.
            - secretRef:
                name: postgres-secrets
            - secretRef:
                name: cobranca-auth
          command:
            - celery
            - -A
            - app.workers.celery_app
            - beat
            - --loglevel=info
            - --schedule
            - /tmp/celerybeat-schedule
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { memory: 256Mi }
