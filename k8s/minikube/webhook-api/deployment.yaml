apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: webhook-api }
  template:
    metadata:
      labels: { app: webhook-api }
    spec:
      containers:
        - name: webhook-api
          image: faelsouz/cobranca-api
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_NAME, value: webhook-api }
          envFrom:
            - configMapRef:
                name: cobranca-env
            # Senhas do Postgres. Chaves em minúsculo: o pydantic-settings não diferencia caixa.
            - secretRef:
                name: postgres-secrets
            - secretRef:
                name: cobranca-auth
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
