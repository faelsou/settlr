apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-conciliacao
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker-conciliacao }
  template:
    metadata:
      labels: { app: worker-conciliacao }
    spec:
      containers:
        - name: worker
          image: faelsouz/cobranca-api
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_NAME, value: worker-conciliacao }
            - name: EVOLUTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evolution-api
                  key: EVOLUTION_API_KEY
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api
                  key: LLM_API_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: cobranca-env
          command:
            - celery
            - -A
            - app.workers.celery_app
            - worker
            - -Q
            - conciliacao,conciliacao-llm
            - -n
            - conciliacao@%h
            - --loglevel=info
            - --concurrency=2
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
