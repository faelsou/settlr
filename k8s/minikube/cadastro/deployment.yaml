apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadastro
spec:
  replicas: 1
  selector:
    matchLabels: { app: cadastro }
  template:
    metadata:
      labels: { app: cadastro }
    spec:
      containers:
        - name: cadastro
          image: faelsouz/cobranca-api
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_NAME, value: cadastro }
          envFrom:
            - configMapRef:
                name: cobranca-env
            # Senhas do Postgres. Chaves em minúsculo: o pydantic-settings não diferencia caixa.
            - secretRef:
                name: postgres-secrets
            - secretRef:
                name: cobranca-auth
          command: ["uvicorn", "app.services.cadastro:app", "--host", "0.0.0.0", "--port", "8000"]
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { memory: 256Mi }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
