apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend-web }
  template:
    metadata:
      labels: { app: frontend-web }
    spec:
      containers:
        - name: frontend-web
          image: faelsouz/cobranca-web
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { memory: 256Mi }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
